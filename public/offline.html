<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>TaskNest · Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: #f7f5f0; color: #171717; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #dedbd5; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgb(23 23 23 / 8%); }
      .mark { width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: 28px; border-radius: 16px; background: #171717; color: #fff; font-size: 24px; font-weight: 750; }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 8vw, 38px); line-height: 1.05; letter-spacing: -.04em; }
      p { margin: 0 0 28px; color: #666; font-size: 16px; line-height: 1.55; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; background: #171717; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #ff7440; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: #111; color: #f5f5f5; }
        main { background: #1d1d1d; border-color: #333; box-shadow: none; }
        .mark, button { background: #f5f5f5; color: #171717; }
        p { color: #aaa; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">T</div>
      <h1>You’re offline</h1>
      <p>TaskNest cannot reach the server right now. Reconnect and try again; your private pages are never stored in the offline cache.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
